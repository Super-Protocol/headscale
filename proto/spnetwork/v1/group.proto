syntax = "proto3";

package network;

option go_package = "github.com/juanfont/headscale/gen/go/spnetwork/v1";

message Participant {
  string id = 1;
  int64 join_date_unix = 2;
}

message Group {
  string id = 1;
  string goal = 2;
  repeated Participant participants = 3;
  uint64 version = 7;
  bool deleted = 8;
  int64 creation_date_unix = 9;
}
