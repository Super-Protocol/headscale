syntax = "proto3";
package spnetwork.v1;

option go_package = "github.com/juanfont/headscale/gen/go/spnetwork/v1";

import "google/protobuf/empty.proto";

message GetDataRequest {
  string node_id = 1;
  bytes node_data = 2;
  map<string, bytes> bucket_hashes = 3;
}

message GetDataResponse {
  map<string, BytesArray> data = 3;
}

message BytesArray {
  repeated bytes items = 1;
}

service GossipService {
  rpc GetData(GetDataRequest) returns (GetDataResponse);
}