syntax = "proto3";

package network;

option go_package = "github.com/juanfont/headscale/gen/go/spnetwork/v1";

message Measurement {
  string owner = 1;
  string target = 2;
  int32 type = 3;
  double value = 4;
  int64 date_unix = 5;
  uint64 version = 6;
  bool deleted = 7;
}

message PingRequest {
  int64 timestamp = 1;
}

message PingResponse {
  int64 request_timestamp = 1;
  int64 response_timestamp = 2;
}
